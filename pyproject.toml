[project]
name = "personal-assistant"
version = "0.1.0"
description = "Conversational personal assistant (Mistral Agents SDK) with persistent memory, files and knowledge recall."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mistralai-agents[bashkit,koyeb]>=1.1.3,<1.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
